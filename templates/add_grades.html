{% extends "base.html" %}

{% block title %}Add or Update Grades{% endblock %}

{% block content %}
<h2>Add or Update Grades</h2>

<form method="POST" action="{{ url_for('add_grades') }}">
    <label for="roll_number">Roll Number:</label>
    <input type="text" id="roll_number" name="roll_number" placeholder="Enter student roll number" required />

    {% for subject in subjects %}
    <label for="{{ subject.lower() }}">{{ subject }}:</label>
    <input type="number" id="{{ subject.lower() }}" name="{{ subject.lower() }}" min="0" max="100" placeholder="Enter grade for {{ subject }}" required />
    {% endfor %}

    <button type="submit">Submit Grades</button>
</form>
{% endblock %}
